name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      DB_HOST: localhost
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: root
      DB_PORT: 5432
       
    strategy:
      matrix:
        go_version: ['1.21', '1.20']   # atualizado para versões mais recentes
        os: ['ubuntu-latest', 'ubuntu-22.04']  # substituí 18.04 por 22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go_version }}

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v3.1.0
        with:
          # Artifact name
          name: artifact
          # A file, directory or wildcard pattern that describes what to upload
          path: ./build
          # The desired behavior if no files are found using the provided path.
          # Available Options: warn, error, ignore
          if-no-files-found: warn
          # Duration after which artifact will expire in days. Minimum 1, maximum 90.
          retention-days: 7

  docker:
    needs: test
    uses: ./.github/workflows/Docker.yml
