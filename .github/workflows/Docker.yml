name: Docker work

on:
  workflow_call:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v2

      - name: Verificar secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME não está definido!"
            exit 1
          fi
          if [ -z "${{ secrets.PASSWORD_DOCKER_HUB }}" ]; then
            echo "PASSWORD_DOCKER_HUB não está definido!"
            exit 1
          fi
          echo "Secrets estão disponíveis."

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meu-programa:latest
